name: Sync Upstream

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_master:
        description: "Force-push master from upstream (overwrites fork-only commits)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/metabase/metabase.git || true
          git fetch upstream master

      - name: Sync master from upstream
        continue-on-error: true
        env:
          FORCE: ${{ github.event.inputs.force_master || 'false' }}
        run: |
          git checkout master
          if [ "$FORCE" = "true" ]; then
            echo "⚠️ Force-syncing master from upstream"
            git reset --hard upstream/master
            git push origin master --force
          else
            git merge upstream/master --no-edit
            git push origin master
          fi

      - name: Sync feature/community-oidc
        continue-on-error: true
        run: |
          git checkout feature/community-oidc
          git merge upstream/master --no-edit
          git push origin feature/community-oidc

      - name: Sync feature/custom-ai-provider
        continue-on-error: true
        run: |
          git checkout feature/custom-ai-provider
          git merge upstream/master --no-edit
          git push origin feature/custom-ai-provider

      - name: Report sync status
        if: always()
        run: |
          echo "## Sync Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| master | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| feature/community-oidc | ✅ merged or ⚠️ conflict (check logs) |" >> $GITHUB_STEP_SUMMARY
          echo "| feature/custom-ai-provider | ✅ merged or ⚠️ conflict (check logs) |" >> $GITHUB_STEP_SUMMARY
